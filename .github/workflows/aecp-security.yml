name: AECP Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Run dependency security audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee security-audit.log
      - run: node --check electron/lib/security-policy.cjs
      - run: node --check electron/lib/lock-manager.cjs
      - run: node --check electron/lib/evidence-manager.cjs
      - run: node --check electron/lib/context-bus.cjs
      - run: node --check electron/lib/provider-router.cjs
      - run: node --check electron/lib/github-gateway.cjs
      - run: node --check electron/lib/ci-monitor.cjs
      - run: node --check electron/lib/delivery.cjs
      - run: node --check electron/lib/control-plane.cjs
      - run: node --check electron/lib/harness.cjs
      - run: node --check electron/lib/event-ledger.cjs
      - run: node --check electron/lib/resource-manager.cjs
      - run: node --check electron/lib/maintenance.cjs
      - run: node --check electron/lib/remote-gateway.cjs
      - run: node --check electron/lib/github-webhook.cjs
      - run: npm run verify
      - name: Upload security and license evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aecp-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            security-audit.log
            artifacts/license-audit.json
          if-no-files-found: warn
          retention-days: 14