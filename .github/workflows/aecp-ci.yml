name: AECP CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: aecp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Run canonical verification and capture evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          npm run verify *> artifacts/npm-verify.log
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/npm-verify.log; exit $LASTEXITCODE }
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aecp-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/npm-verify.log
            artifacts/license-audit.json
            artifacts/requirements-coverage.json
          if-no-files-found: error
          retention-days: 14
