name: AECP Packaging

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check release tree on Windows
        run: npm run check
      - name: Build architecture-specific fallback installer
        shell: pwsh
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - name: Upload fallback installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aecp-windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  smoke-install:
    name: Smoke install Windows ${{ matrix.arch }}
    needs: package-windows
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-${{ matrix.arch }}
          path: smoke
      - name: Silent install and uninstall smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem smoke -Filter '*.exe' -Recurse | Where-Object { $_.Name -match '-${{ matrix.arch }}-' } | Select-Object -First 1
          if (-not $installer) { throw 'Architecture installer artifact not found.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'aecp-smoke-${{ matrix.arch }}'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)." }
          $app = Get-ChildItem $installDir -Filter 'AI Engineering Control Plane.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'Installed AECP executable not found.' }
          $launch = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($launch.ExitCode -ne 0) { throw "Installed AECP smoke launch exited with $($launch.ExitCode)." }
          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'AECP uninstaller not found.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path $app.FullName) { throw 'AECP executable still exists after uninstall.' }

  package-windows-auto:
    name: Package Windows Auto Detect (x64 + ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check release tree on Windows
        run: npm run check
      - name: Build single auto-detect installer
        run: npm run dist:auto
      - name: Upload primary installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aecp-windows-auto
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  package-universal-bootstrap:
    name: Package Universal Bootstrap
    needs: package-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-x64
          path: staging/x64
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-arm64
          path: staging/arm64
      - name: Stage architecture payloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/universal-bootstrap/payloads | Out-Null
          $x = Get-ChildItem staging/x64 -Filter '*x64*.exe' -Recurse | Select-Object -First 1
          $a = Get-ChildItem staging/arm64 -Filter '*arm64*.exe' -Recurse | Select-Object -First 1
          if (-not $x -or -not $a) { throw 'Architecture installer payloads not found.' }
          Copy-Item $x.FullName release/universal-bootstrap/payloads/AI-Engineering-Control-Plane-Setup-x64.exe
          Copy-Item $a.FullName release/universal-bootstrap/payloads/AI-Engineering-Control-Plane-Setup-arm64.exe
      - name: Build self-contained universal bootstrap
        shell: pwsh
        working-directory: release/universal-bootstrap
        run: dotnet publish UniversalBootstrap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../../release/universal-ci
      - name: Normalize universal artifact name
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/universal-ci -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Universal bootstrap executable not found.' }
          Rename-Item $exe.FullName 'AI-Engineering-Control-Plane-Setup-universal.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-universal-bootstrap
          path: release/universal-ci/AI-Engineering-Control-Plane-Setup-universal.exe
          if-no-files-found: error
          retention-days: 14

  smoke-universal-bootstrap:
    name: Smoke universal bootstrap Windows ${{ matrix.arch }}
    needs: package-universal-bootstrap
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aecp-universal-bootstrap
          path: smoke-universal
      - name: Install through architecture-selecting bootstrap and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem smoke-universal -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Universal bootstrap artifact not found.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'aecp-universal-${{ matrix.arch }}'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $env:AECP_BOOTSTRAP_INSTALL_ARGS = "/S /D=$installDir"
          $process = Start-Process -FilePath $installer.FullName -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Universal bootstrap exited with $($process.ExitCode)." }
          $app = Get-ChildItem $installDir -Filter 'AI Engineering Control Plane.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'AECP executable not found after universal bootstrap install.' }
          $launch = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($launch.ExitCode -ne 0) { throw "Universal-installed AECP smoke launch exited with $($launch.ExitCode)." }
          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'AECP uninstaller not found after universal bootstrap install.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Universal bootstrap uninstall exited with $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path $app.FullName) { throw 'AECP executable still exists after universal bootstrap uninstall.' }

