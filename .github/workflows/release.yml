name: Build and Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-fallback:
    name: Build Windows fallback ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Build architecture-specific fallback installer
        shell: pwsh
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  build-auto:
    name: Build Windows Auto Detect (x64 + ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Build single auto-detect installer
        run: npm run dist:auto
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-windows-auto
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish preview GitHub Release
    needs: [build-fallback, build-auto]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aecp-windows-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="v$(node -p \"require('./package.json').version\")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping the existing immutable preview release."
            exit 0
          fi
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AI Engineering Control Plane $TAG" \
            --notes-file RELEASE_NOTES.md \
            --prerelease

  build-universal:
    needs: [build-x64, build-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-x64
          path: staging/x64
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-arm64
          path: staging/arm64
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/universal-bootstrap/payloads | Out-Null
          $x = Get-ChildItem staging/x64 -Filter '*x64*.exe' -Recurse | Select-Object -First 1
          $a = Get-ChildItem staging/arm64 -Filter '*arm64*.exe' -Recurse | Select-Object -First 1
          if (-not $x -or -not $a) { throw 'Architecture installer payloads not found.' }
          Copy-Item $x.FullName release/universal-bootstrap/payloads/AI-Engineering-Control-Plane-Setup-x64.exe
          Copy-Item $a.FullName release/universal-bootstrap/payloads/AI-Engineering-Control-Plane-Setup-arm64.exe
      - shell: pwsh
        working-directory: release/universal-bootstrap
        run: dotnet publish UniversalBootstrap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../../release/universal
      - shell: pwsh
        run: |
          $exe = Get-ChildItem release/universal -Filter '*.exe' | Select-Object -First 1
          Rename-Item $exe.FullName "release/universal/AI-Engineering-Control-Plane-Setup-$env:GITHUB_REF_NAME.exe"
          $final = Get-ChildItem release/universal -Filter '*.exe' | Select-Object -First 1
          $hash = (Get-FileHash $final.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($final.Name)" | Out-File -Encoding ascii release/universal/SHA256SUMS-universal.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-universal-installer
          path: release/universal/**
