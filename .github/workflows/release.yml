name: Build and Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-fallback:
    name: Build Windows fallback ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Build architecture-specific fallback installer
        shell: pwsh
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  smoke-install:
    name: Smoke install Windows ${{ matrix.arch }}
    needs: [build-fallback]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-${{ matrix.arch }}
          path: smoke
      - name: Silent install and uninstall smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem smoke -Filter '*.exe' -Recurse | Where-Object { $_.Name -match '-${{ matrix.arch }}-' } | Select-Object -First 1
          if (-not $installer) { throw 'Architecture installer artifact not found.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'aecp-smoke-${{ matrix.arch }}'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)." }
          $app = Get-ChildItem $installDir -Filter 'AI Engineering Control Plane.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'Installed AECP executable not found.' }
          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'AECP uninstaller not found.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path $app.FullName) { throw 'AECP executable still exists after uninstall.' }

  build-auto:
    name: Build Windows Auto Detect (x64 + ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Build single auto-detect installer
        run: npm run dist:auto
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-windows-auto
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  build-universal:
    needs: [build-fallback]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-x64
          path: staging/x64
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-arm64
          path: staging/arm64
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/universal-bootstrap/payloads | Out-Null
          $x = Get-ChildItem staging/x64 -Filter '*x64*.exe' -Recurse | Select-Object -First 1
          $a = Get-ChildItem staging/arm64 -Filter '*arm64*.exe' -Recurse | Select-Object -First 1
          if (-not $x -or -not $a) { throw 'Architecture installer payloads not found.' }
          Copy-Item $x.FullName release/universal-bootstrap/payloads/AI-Engineering-Control-Plane-Setup-x64.exe
          Copy-Item $a.FullName release/universal-bootstrap/payloads/AI-Engineering-Control-Plane-Setup-arm64.exe
      - shell: pwsh
        working-directory: release/universal-bootstrap
        run: dotnet publish UniversalBootstrap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../../release/universal
      - shell: pwsh
        run: |
          $exe = Get-ChildItem release/universal -Filter '*.exe' | Select-Object -First 1
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+].*)?
          $hash = (Get-FileHash $final.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($final.Name)" | Out-File -Encoding ascii release/universal/SHA256SUMS-universal.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-universal-installer
          path: release/universal/**


  smoke-universal:
    name: Smoke universal release bootstrap Windows ${{ matrix.arch }}
    needs: build-universal
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aecp-universal-installer
          path: smoke-universal
      - name: Install through universal bootstrap and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem smoke-universal -Filter '*.exe' -Recurse | Where-Object { $_.Name -like 'AI-Engineering-Control-Plane-Setup-*.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'Universal release bootstrap not found.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'aecp-release-universal-${{ matrix.arch }}'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $env:AECP_BOOTSTRAP_INSTALL_ARGS = "/S /D=$installDir"
          $install = Start-Process -FilePath $installer.FullName -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Universal release bootstrap exited with $($install.ExitCode)." }
          $app = Get-ChildItem $installDir -Filter 'AI Engineering Control Plane.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'AECP executable not found after universal release install.' }
          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'AECP uninstaller not found after universal release install.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Universal release uninstall exited with $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path $app.FullName) { throw 'AECP executable still exists after universal release uninstall.' }

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-fallback, build-auto, build-universal, smoke-install, smoke-universal]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-x64
          path: release-assets/x64
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-arm64
          path: release-assets/arm64
      - uses: actions/download-artifact@v4
        with:
          name: aecp-universal-installer
          path: release-assets/universal
      - name: Generate release-wide SHA256 manifest
        shell: pwsh
        run: |
          $lines = Get-ChildItem release-assets -Recurse -Filter '*.exe' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii release-assets/SHA256SUMS.txt
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "AECP $tag" --generate-notes
          }
          Get-ChildItem release-assets -Recurse -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
) { $version = 'preview' }
          Rename-Item $exe.FullName "release/universal/AI-Engineering-Control-Plane-Setup-$version.exe"
          $final = Get-ChildItem release/universal -Filter '*.exe' | Select-Object -First 1
          $hash = (Get-FileHash $final.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($final.Name)" | Out-File -Encoding ascii release/universal/SHA256SUMS-universal.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-universal-installer
          path: release/universal/**


  smoke-universal:
    name: Smoke universal release bootstrap Windows ${{ matrix.arch }}
    needs: build-universal
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aecp-universal-installer
          path: smoke-universal
      - name: Install through universal bootstrap and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem smoke-universal -Filter '*.exe' -Recurse | Where-Object { $_.Name -like 'AI-Engineering-Control-Plane-Setup-*.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'Universal release bootstrap not found.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'aecp-release-universal-${{ matrix.arch }}'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $env:AECP_BOOTSTRAP_INSTALL_ARGS = "/S /D=$installDir"
          $install = Start-Process -FilePath $installer.FullName -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Universal release bootstrap exited with $($install.ExitCode)." }
          $app = Get-ChildItem $installDir -Filter 'AI Engineering Control Plane.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'AECP executable not found after universal release install.' }
          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'AECP uninstaller not found after universal release install.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Universal release uninstall exited with $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 2
          if (Test-Path $app.FullName) { throw 'AECP executable still exists after universal release uninstall.' }

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-fallback, build-auto, build-universal, smoke-install, smoke-universal]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-x64
          path: release-assets/x64
      - uses: actions/download-artifact@v4
        with:
          name: aecp-windows-arm64
          path: release-assets/arm64
      - uses: actions/download-artifact@v4
        with:
          name: aecp-universal-installer
          path: release-assets/universal
      - name: Generate release-wide SHA256 manifest
        shell: pwsh
        run: |
          $lines = Get-ChildItem release-assets -Recurse -Filter '*.exe' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii release-assets/SHA256SUMS.txt
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "AECP $tag" --generate-notes
          }
          Get-ChildItem release-assets -Recurse -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
