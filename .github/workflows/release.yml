name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Build NSIS installer
        shell: pwsh
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: aecp-windows-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish preview GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aecp-windows-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping the existing immutable preview release."
            exit 0
          fi
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AI Engineering Control Plane $TAG" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
